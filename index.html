<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地下段列車 G-meter 測速儀</title>
  <style>
  /* --- 基礎設定 --- */
  * { box-sizing: border-box; }

  body { 
    margin: 0; 
    background: #121212; 
    color: #e0e0e0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex; 
    justify-content: center; 
    padding: 12px; 
    width: 100%;   
  }

  /* 主容器 */
  .calculator { 
    background: #1e1e1e; 
    padding: 20px; 
    border-radius: 16px; 
    width: 100%;       
    max-width: 440px; 
    border: 1px solid #333; /* 寫死深色線條 */
    box-shadow: 0 12px 30px rgba(0,0,0,0.45); 
    overflow: hidden;  
  }

  h1 { font-size: 1.25rem; color: #ff9800; text-align: center; margin: 0 0 20px; }

  /* 提示文字 */
  .label-hint { font-size: 0.8rem; color: #888; margin-bottom: 10px; }

  /* 快速選取按鈕 */
  .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  .quick-tags button { 
    background: #2a2a2a; 
    color: #ff9800; 
    border: 1.5px solid #ff9800; 
    padding: 8px 4px; 
    border-radius: 7px; 
    font-size: 0.74rem; 
    flex: 1 1 calc(33.333% - 8px); 
    cursor: pointer; 
    transition: all 0.15s ease; 
    font-weight: 600;
    white-space: nowrap;     
    overflow: hidden;        
    text-overflow: ellipsis; 
  }

  /* 萬用按鈕點擊特效 (包含所有歷史紀錄區域按鈕) */
  .calculator button:active,
  .record-card button:active { 
    filter: brightness(0.75) !important; 
    transform: scale(0.95) !important; 
    transition: filter 0.05s, transform 0.05s !important;
  }

  /* 輸入框控制 */
  .horizontal-inputs { display: flex; gap: 10px; }
  .horizontal-inputs input { flex: 1; min-width: 0; }

  .input-group { margin-bottom: 15px; }
  label { display: block; font-size: 0.82rem; margin-bottom: 6px; color: #aaa; }

  input { 
    width: 100%; 
    padding: 11px; 
    background: #252525; 
    border: 1px solid #444; 
    border-radius: 8px; 
    color: #fff; 
    outline: none; 
    font-size: 0.95rem;
  }

  input:focus { border-color: #ff9800; }

  /* 車廂組合顯示盒 */
  .parts-box { 
    background: #252525; 
    border: 1px solid #333; 
    border-radius: 10px; 
    padding: 12px; 
    min-height: 50px; 
    margin-bottom: 15px;
  }

  .placeholder-text { color: #555; text-align: center; font-size: 0.8rem; padding-top: 5px; }

  .part-row { 
    display: grid; 
    grid-template-columns: 1fr 80px; 
    gap: 10px; 
    align-items: center; 
    margin-bottom: 8px; 
  }

  .part-name { color: #ddd; font-size: 0.85rem; font-weight: 600; }
  .part-row input { text-align: center; padding: 5px; height: 30px; }

  .calc-btn { 
    flex: 2; 
    background: #ff9800; 
    color: #121212; 
    border: none; 
    padding: 12px; 
    border-radius: 8px; 
    font-weight: bold; 
    cursor: pointer; 
  }

  .calc-btn:hover { background: #e68a00; }

  /* 結果區域 */
  .result-box { 
    background: #121212; 
    padding: 16px; 
    border-radius: 12px; 
    text-align: center; 
    margin: 12px 0; 
    border: 1px solid #222; 
    transition: border-color 0.3s;
  }

  .speed { font-size: 2.5rem; color: #ff9800; font-weight: 800; }
  .unit { font-size: 0.9rem; color: #666; margin-left: 4px; }
  .info { font-size: 0.85rem; color: #aaa; margin-top: 6px; }

  hr { 
    border: 0; 
    border-top: 1px solid #333; 
    margin: 20px 0; 
  }

  /* 輔助對照表 */
  .reference-guide { 
    background: #252525; 
    padding: 12px; 
    border-radius: 10px; 
    border: 1px solid #333; 
    margin-top: 20px; 
  }

  .guide-title { 
    font-size: 0.8rem; 
    color: #ff9800; 
    margin-bottom: 8px; 
    font-weight: bold; 
  }

  .guide-content { 
    max-height: 270px; 
    overflow-y: auto; 
    font-size: 0.75rem; 
  }

  /* 表格樣式 */
  table { width: 100%; border-collapse: collapse; }
  td { 
    padding: 8px 5px; 
    border-bottom: 1px solid #333; 
    color: #888; 
  }
  td:first-child { color: #ff9800; font-weight: bold; width: 80px; }
  .guide-content::-webkit-scrollbar { width: 4px; }
  .guide-content::-webkit-scrollbar-thumb { background: #ff9800; border-radius: 10px; }

  .btn-row { 
    display: flex; 
    gap: 8px; 
    margin: 10px 0; 
  }

  .reset-btn { 
    flex: 0 0 90px; 
    background: #333; 
    color: #999; 
    border: 1px solid #444; 
    border-radius: 8px; 
    font-size: 0.75rem;
    cursor: pointer;
  }

  /* 秒數助手外框 */
  .helper-box {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px dashed #555;
  }

  .helper-label {
    color: #ff9800;
    font-weight: bold;
    display: block;
    margin-bottom: 12px;
  }

  .helper-inputs {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 12px;
  }

  .helper-inputs input {
    flex: 1;
    min-width: 0; 
    text-align: center;
    padding: 10px 5px;
    height: 38px;
  }

  .operator {
    color: #888;
    font-weight: bold;
    padding: 0 5px;
  }

  .helper-btns {
    display: flex;
    gap: 10px;
  }

  .btn-fill {
    flex: 2;
    padding: 12px;
    background: transparent;
    color: #ff9800;
    border: 1.5px solid #ff9800;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-clear {
    flex: 1;
    padding: 12px;
    background: #333;
    color: #888;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .reset-all-container {
    margin-bottom: 20px;
  }

  .btn-danger {
    width: 100%;
    padding: 12px;
    background: #442222;
    color: #ff6666;
    border: 1px solid #663333;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  .accel-theme {
    background: #e65c00 !important;
    color: #fff !important;
  }

  .accel-box {
    border-color: #444 !important;
  }

  .light-speed {
    color: #e0e0e0 !important;
  }

  .category-title {
    color: #fff !important;      
    font-size: 0.95rem;          
    font-weight: 800;            
    padding-top: 15px !important;
    padding-bottom: 5px !important;
    border-bottom: 2px solid #ff9800; 
    width: 100%;                 
  }

  /* 歷史觀測紀錄日誌樣式 */
  .record-card {
    margin-top: 20px;
  }

  .record-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
  }

  .record-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .btn-clear-all {
    background-color: #e74c3c !important;
    color: white !important;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: auto !important;
    margin: 0;
    transition: opacity 0.2s ease, transform 0.1s ease;
  }

  .record-table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 6px;
  }

  .record-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 14px;
    white-space: nowrap; 
  }

  .record-table th {
    padding: 12px 10px;
    border-bottom: 2px solid #333;
    color: #888;
    font-weight: 500;
    font-size: 13px;
  }

  .record-table tr {
    border-bottom: 1px solid #333;
    transition: background-color 0.15s ease;
  }

  .record-table tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.02);
  }

  .record-table td {
    padding: 12px 10px;
    vertical-align: middle;
  }

  .record-data-cell {
    font-family: 'Noto Sans Mono', ui-monospace, 'SFMono-Regular', 'Roboto Mono', Consolas, monospace !important;
    font-weight: 700;
    font-size: 16px;
    color: #e0e0e0;
  }

  .record-badge {
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    display: inline-block;
  }

  .badge-speed {
    background-color: rgba(52, 152, 219, 0.15);
    color: #3498db;
  }

  .badge-accel {
    background-color: rgba(46, 204, 113, 0.15);
    color: #2ecc71;
  }

  .btn-delete {
    background: #442222;
    color: #ff6666;
    border: 1px solid #663333;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
    transition: transform 0.05s ease, filter 0.05s ease;
  }

  .pagination-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 15px;
  }

  .btn-page {
    background: #2a2a2a;
    color: #ff9800;
    border: 1px solid #ff9800;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }

  .btn-page:disabled {
    border-color: #444;
    color: #555;
    cursor: not-allowed;
  }

  .page-info {
    font-size: 0.85rem;
    color: #aaa;
  }

  /* 自訂狀態警示標籤 */
  .status-tag {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 4px;
    margin-top: 4px;
    display: inline-block;
  }
  .status-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
  .status-inactive { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
  </style>
</head>
<body>

<div class="calculator">
  <h1>列車地下段 G-meter 測速儀</h1>

  <!-- iOS 權限要求按鈕 -->
  <div id="permission-btn-container" style="margin-bottom: 15px; display: none;">
    <button id="btn-request-permission" class="btn-fill" style="width: 100%;">點擊授權動態感測器 (iOS)</button>
  </div>

  <!-- 狀態提示區域 -->
  <div style="text-align: center; margin-bottom: 10px;">
    <span id="calib-status" class="status-tag status-inactive">校準狀態：尚未校準 (請於靜止時按 ZERO)</span>
  </div>

  <!-- 速度與加速度顯示面板 -->
  <div class="result-box">
    <div class="speed"><span id="speed-val">0.0</span><span class="unit"> km/h</span></div>
    <div class="info">
      Y 軸加速度：<span id="accel-val" style="color: #ff9800; font-weight: bold;">0.000</span> m/s² 
      (<span id="g-val">0.000</span> G)
    </div>
    <div class="info" style="font-size: 0.75rem; color: #666; margin-top: 4px;">
      測量時長：<span id="timer-val">0.0</span> 秒 | 最高速：<span id="max-speed-val">0.0</span> km/h
    </div>
  </div>

  <!-- 核心控制按鈕列 -->
  <div class="btn-row">
    <button id="btn-zero" class="quick-tags" style="flex: 1; margin: 0;">
      <button class="accel-theme" style="width: 100%; font-size: 0.9rem; padding: 12px;">ZERO 校準歸零</button>
    </button>
    <button id="btn-toggle" class="calc-btn" style="flex: 1;">START 開始錄製</button>
    <button id="btn-reset" class="reset-btn">RESET 重置</button>
  </div>

  <!-- 秒數助手 / 低通濾波調校外框 -->
  <div class="helper-box">
    <span class="helper-label">⚙️ 濾波器與校準參數設定</span>
    
    <label for="lpf-slider">低通濾波強度 (Smoothing Alpha: <span id="lpf-val">0.15</span>)</label>
    <div class="helper-inputs">
      <input type="range" id="lpf-slider" min="0.01" max="0.50" step="0.01" value="0.15">
    </div>

    <label for="bias-display">當前 Y 軸零點偏移量 (Zero Offset):</label>
    <div class="helper-inputs">
      <input type="text" id="bias-display" value="0.0000 m/s²" readonly>
    </div>
  </div>

  <hr>

  <!-- 歷史觀測紀錄日誌 -->
  <div class="record-card">
    <div class="record-header">
      <h3 class="category-title" style="border: none; padding: 0;">觀測紀錄日誌</h3>
      <button id="btn-clear-history" class="btn-clear-all">清空日誌</button>
    </div>

    <div class="record-table-wrapper">
      <table class="record-table">
        <thead>
          <tr>
            <th>時間</th>
            <th>極速 (km/h)</th>
            <th>時長 (s)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="records-tbody">
          <tr>
            <td colspan="4" class="placeholder-text">尚無觀測紀錄，按下 STOP 即自動存檔</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分頁選單 -->
    <div class="pagination-container">
      <button id="btn-prev-page" class="btn-page" disabled>上一頁</button>
      <span id="page-info" class="page-info">第 1 / 1 頁</span>
      <button id="btn-next-page" class="btn-page" disabled>下一頁</button>
    </div>
  </div>
</div>

<script>
// --- 核心演算法與全局變數 ---
let isRecording = false;
let isCalibrated = false;

let yOffset = 0.0;           // ZERO 校準得到的 Y 軸偏置量 (m/s²)
let currentRawY = 0.0;        // 原始 Y 軸數據
let filteredY = 0.0;         // 低通濾波後的加速度
let currentSpeed = 0.0;      // 當前速度 (m/s)
let maxSpeedKmh = 0.0;       // 最高速 (km/h)

let lastTimestamp = null;
let recordingStartTime = null;
let totalRecordedTime = 0.0;

let lpfAlpha = 0.15;         // 低通濾波 Alpha 值

// 分頁紀錄相關變數
let records = [];
let currentPage = 1;
const rowsPerPage = 5;

// DOM 元件引用
const speedValEl = document.getElementById('speed-val');
const accelValEl = document.getElementById('accel-val');
const gValEl = document.getElementById('g-val');
const timerValEl = document.getElementById('timer-val');
const maxSpeedValEl = document.getElementById('max-speed-val');
const calibStatusEl = document.getElementById('calib-status');
const biasDisplayEl = document.getElementById('bias-display');

const btnZero = document.getElementById('btn-zero');
const btnToggle = document.getElementById('btn-toggle');
const btnReset = document.getElementById('btn-reset');
const lpfSlider = document.getElementById('lpf-slider');
const lpfValEl = document.getElementById('lpf-val');

const recordsTbody = document.getElementById('records-tbody');
const btnClearHistory = document.getElementById('btn-clear-history');
const btnPrevPage = document.getElementById('btn-prev-page');
const btnNextPage = document.getElementById('btn-next-page');
const pageInfoEl = document.getElementById('page-info');

// --- 1. iOS 權限申請檢查 ---
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
  const permBtnContainer = document.getElementById('permission-btn-container');
  permBtnContainer.style.display = 'block';
  
  document.getElementById('btn-request-permission').addEventListener('click', () => {
    DeviceMotionEvent.requestPermission()
      .then(response => {
        if (response === 'granted') {
          permBtnContainer.style.display = 'none';
          initSensorListener();
        } else {
          alert('需要加速度計權限才能進行測速！');
        }
      })
      .catch(console.error);
  });
} else {
  initSensorListener();
}

// --- 2. 監聽手機加速度計事件 ---
function initSensorListener() {
  window.addEventListener('devicemotion', (event) => {
    if (!event.accelerationIncludingGravity) return;
    
    // 取出 Y 軸數據 (m/s²)
    // 註：有些瀏覽器手機縱向朝前時前進為 -Y 或 +Y，依情況調整符號
    let rawY = event.accelerationIncludingGravity.y || 0.0;
    currentRawY = rawY;

    // 低通濾波處理 (Low-Pass Filter) 消除微小抖動
    filteredY = filteredY + lpfAlpha * (currentRawY - filteredY);

    // 計算扣除 ZERO 校準後的淨加速度
    let cleanAccel = filteredY - yOffset;

    // 更新即時加速度與 G 值 UI
    accelValEl.textContent = cleanAccel.toFixed(3);
    gValEl.textContent = (cleanAccel / 9.80665).toFixed(3);

    // 若正在錄製，執行積分算速度
    const now = performance.now();
    if (isRecording) {
      if (lastTimestamp !== null) {
        let dt = (now - lastTimestamp) / 1000.0; // 秒
        if (dt > 0 && dt < 0.5) { // 避免背景分頁導致 dt 過大
          // 數值積分：v_new = v_old + a * dt
          currentSpeed += cleanAccel * dt;
          if (currentSpeed < 0) currentSpeed = 0; // 防止靜止負值漂移

          let speedKmh = currentSpeed * 3.6;
          speedValEl.textContent = speedKmh.toFixed(1);

          if (speedKmh > maxSpeedKmh) {
            maxSpeedKmh = speedKmh;
            maxSpeedValEl.textContent = maxSpeedKmh.toFixed(1);
          }

          totalRecordedTime = (now - recordingStartTime) / 1000.0;
          timerValEl.textContent = totalRecordedTime.toFixed(1);
        }
      }
      lastTimestamp = now;
    }
  });
}

// --- 3. 按鈕事件綁定 ---

// 【ZERO 校準按鈕】
btnZero.addEventListener('click', () => {
  // 擷取當前低通濾波後的 Y 軸數值作為 Bias 偏置量
  yOffset = filteredY;
  isCalibrated = true;

  // 強制速度與時間歸零
  currentSpeed = 0.0;
  speedValEl.textContent = "0.0";
  biasDisplayEl.value = yOffset.toFixed(4) + " m/s²";

  // 更新 UI 狀態標籤
  calibStatusEl.className = "status-tag status-active";
  calibStatusEl.textContent = "校準狀態：已啟用 ZERO 校準";
});

// 【START / STOP 開始與停止按鈕】
btnToggle.addEventListener('click', () => {
  if (!isCalibrated) {
    if (!confirm("⚠️ 尚未執行 ZERO 校準，建議在列車完全靜止時按 ZERO 以避免重力漂移！確定要直接開始嗎？")) {
      return;
    }
  }

  isRecording = !isRecording;

  if (isRecording) {
    btnToggle.textContent = "STOP 停止錄製";
    btnToggle.style.background = "#e74c3c";
    btnToggle.style.color = "#fff";
    
    lastTimestamp = performance.now();
    recordingStartTime = lastTimestamp;
  } else {
    btnToggle.textContent = "START 開始錄製";
    btnToggle.style.background = "#ff9800";
    btnToggle.style.color = "#121212";

    // 停止錄製時自動存入歷史紀錄
    if (totalRecordedTime > 1.0) {
      addRecord(maxSpeedKmh, totalRecordedTime);
    }
  }
});

// 【RESET 重置按鈕】
btnReset.addEventListener('click', () => {
  isRecording = false;
  btnToggle.textContent = "START 開始錄製";
  btnToggle.style.background = "#ff9800";
  btnToggle.style.color = "#121212";

  currentSpeed = 0.0;
  maxSpeedKmh = 0.0;
  totalRecordedTime = 0.0;
  lastTimestamp = null;

  speedValEl.textContent = "0.0";
  maxSpeedValEl.textContent = "0.0";
  timerValEl.textContent = "0.0";
});

// 【濾波器滑桿調整】
lpfSlider.addEventListener('input', (e) => {
  lpfAlpha = parseFloat(e.target.value);
  lpfValEl.textContent = lpfAlpha.toFixed(2);
});

// --- 4. 歷史紀錄日誌與分頁系統 ---
function addRecord(maxSpeed, duration) {
  const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  records.unshift({
    id: Date.now(),
    time: timeStr,
    maxSpeed: maxSpeed.toFixed(1),
    duration: duration.toFixed(1)
  });
  renderRecords();
}

function renderRecords() {
  if (records.length === 0) {
    recordsTbody.innerHTML = `<tr><td colspan="4" class="placeholder-text">尚無觀測紀錄，按下 STOP 即自動存檔</td></tr>`;
    btnPrevPage.disabled = true;
    btnNextPage.disabled = true;
    pageInfoEl.textContent = `第 1 / 1 頁`;
    return;
  }

  const totalPages = Math.ceil(records.length / rowsPerPage);
  if (currentPage > totalPages) currentPage = totalPages;

  const startIndex = (currentPage - 1) * rowsPerPage;
  const pageRecords = records.slice(startIndex, startIndex + rowsPerPage);

  recordsTbody.innerHTML = pageRecords.map(r => `
    <tr>
      <td>${r.time}</td>
      <td class="record-data-cell"><span class="record-badge badge-speed">${r.maxSpeed}</span></td>
      <td>${r.duration} s</td>
      <td><button class="btn-delete" onclick="deleteRecord(${r.id})">刪除</button></td>
    </tr>
  `).join('');

  pageInfoEl.textContent = `第 ${currentPage} / ${totalPages} 頁`;
  btnPrevPage.disabled = (currentPage === 1);
  btnNextPage.disabled = (currentPage === totalPages);
}

window.deleteRecord = function(id) {
  records = records.filter(r => r.id !== id);
  renderRecords();
};

btnClearHistory.addEventListener('click', () => {
  if (records.length === 0) return;
  if (confirm("確定要清空所有歷史觀測紀錄嗎？")) {
    records = [];
    currentPage = 1;
    renderRecords();
  }
});

btnPrevPage.addEventListener('click', () => {
  if (currentPage > 1) {
    currentPage--;
    renderRecords();
  }
});

btnNextPage.addEventListener('click', () => {
  const totalPages = Math.ceil(records.length / rowsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderRecords();
  }
});
</script>

</body>
</html>
