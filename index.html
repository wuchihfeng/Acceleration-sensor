<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加速度積分 與 GPS測速器 1.5</title>
  <style>
  /* --- 基礎設定 --- */
  * { box-sizing: border-box; }

  body { 
    margin: 0; 
    background: #121212; 
    color: #e0e0e0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex; 
    justify-content: center; 
    padding: 12px; 
    width: 100%;   
  }

  .calculator { 
    background: #1e1e1e; 
    padding: 20px; 
    border-radius: 16px; 
    width: 100%;       
    max-width: 440px; 
    border: 1px solid #333;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45); 
    overflow: hidden;  
  }

  h1 { font-size: 1.2rem; color: #ff9800; text-align: center; margin: 0 0 15px; }

  .calculator button:active,
  .record-card button:active { 
    filter: brightness(0.75) !important; 
    transform: scale(0.95) !important; 
    transition: filter 0.05s, transform 0.05s !important;
  }

  input { 
    width: 100%; 
    padding: 10px; 
    background: #252525; 
    border: 1px solid #444; 
    border-radius: 8px; 
    color: #fff; 
    outline: none; 
    font-size: 0.85rem;
  }

  input:focus { border-color: #ff9800; }

  .ctrl-btn { 
    flex: 1; 
    border: none; 
    padding: 10px 4px; 
    border-radius: 8px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 0.82rem;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }

  .btn-zero-style {
    background: #e65c00;
    color: #ffffff;
  }
  .btn-zero-style:hover { background: #cf5300; }

  .btn-gmeter-recording {
    background: #e74c3c !important;
    color: #fff !important;
  }
  .btn-gmeter-idle {
    background: #ff9800;
    color: #121212;
  }

  .btn-gps-recording {
    background: #e74c3c !important;
    color: #fff !important;
  }
  .btn-gps-idle {
    background: #00bcd4;
    color: #121212;
  }

  .speed-compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .speed-card {
    background: #181818;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 10px 5px;
    text-align: center;
  }

  .speed-card-title {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .speed-val-lg {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.1;
  }

  .gmeter-color { color: #ff9800; }
  .gps-color { color: #00bcd4; }

  .unit { font-size: 0.75rem; color: #666; margin-left: 2px; }

  .result-box { 
    background: #121212; 
    padding: 14px; 
    border-radius: 12px; 
    text-align: center; 
    margin: 12px 0; 
    border: 1px solid #222; 
  }
  
  .distance-box {
    font-size: 0.95rem;
    color: #3498db;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .info { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
  .axis-title { color: #888; font-weight: 600; }

  hr { 
    border: 0; 
    border-top: 1px solid #333; 
    margin: 18px 0; 
  }

/* 修改前：grid-template-columns: 1fr 1.2fr 1.2fr 0.8fr; */
.btn-row { 
  display: grid; 
  grid-template-columns: 1fr 1fr; /* 改為兩列等寬 */
  gap: 8px;                       /* 稍微調大間隙讓排版更好看 */
  margin: 10px 0; 
}


  .reset-btn { 
    background: #333; 
    color: #999; 
    border: 1px solid #444; 
    border-radius: 8px; 
    font-size: 0.82rem;
    font-weight: bold;
    cursor: pointer;
  }

  .helper-box {
    background: #2a2a2a;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px dashed #555;
  }

  .helper-label {
    color: #ff9800;
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }

  .helper-inputs {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 8px;
  }

  .btn-fill {
    flex: 1;
    padding: 10px;
    background: transparent;
    color: #ff9800;
    border: 1.5px solid #ff9800;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .category-title {
    color: #fff !important;      
    font-size: 0.95rem;          
    font-weight: 800;            
    width: auto;                  
    padding-top: 0 !important;   
    padding-bottom: 5px !important;
    border-bottom: 2px solid #ff9800;
  }

  .record-card { margin-top: 15px; }

  .record-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid #333;
    padding-bottom: 8px;
  }

  .btn-clear-all {
    background-color: #e74c3c !important;
    color: white !important;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap; 
  }

  .record-table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 6px;
  }

  .record-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 12px;
    white-space: nowrap; 
  }

  .record-table th {
    padding: 8px 6px;
    border-bottom: 2px solid #333;
    color: #888;
    font-weight: 500;
  }

  .record-table td {
    padding: 8px 6px;
    vertical-align: middle;
  }

  .record-data-cell {
    font-family: 'Noto Sans Mono', ui-monospace, Consolas, monospace !important;
    font-weight: 700;
  }

  .record-badge {
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
  }

  .badge-gmeter { background-color: rgba(255, 152, 0, 0.15); color: #ff9800; }
  .badge-gps { background-color: rgba(0, 188, 212, 0.15); color: #00bcd4; }
  .badge-none { background-color: rgba(120, 120, 120, 0.15); color: #777; }

  .btn-delete {
    background: #442222;
    color: #ff6666;
    border: 1px solid #663333;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }

  .pagination-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .btn-page {
    background: #2a2a2a;
    color: #ff9800;
    border: 1px solid #ff9800;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.8rem;
  }

  .btn-page:disabled { border-color: #444; color: #555; cursor: not-allowed; }
  .page-info { font-size: 0.8rem; color: #aaa; }

  .status-tag {
    font-size: 0.72rem;
    padding: 3px 6px;
    border-radius: 4px;
    display: inline-block;
  }
  .status-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
  .status-inactive { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
  .status-gps { background: rgba(0, 188, 212, 0.2); color: #00bcd4; border: 1px solid #00bcd4; }
  .placeholder-text { color: #555; text-align: center; font-size: 0.8rem; padding: 15px 0; }
  </style>
</head>
<body>

<div class="calculator">
  <h1>加速度積分 與 GPS測速器</h1>

  <!-- 權限要求按鈕列 -->
  <div id="permission-btn-container" style="margin-bottom: 12px; display: flex; gap: 8px;">
    <button id="btn-request-permission" class="btn-fill">啟動動態感測器</button>
    <button id="btn-request-gps" class="btn-fill" style="color: #00bcd4; border-color: #00bcd4;">開啟 GPS 定位</button>
  </div>

  <!-- 狀態提示區域 -->
  <div style="text-align: center; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; align-items: center;">
    <span id="calib-status" class="status-tag status-inactive">未校準 (請靜止時按矯正歸零)</span>
    <span id="gps-status" class="status-tag status-inactive">GPS 定位：未啟動</span>
  </div>

  <!-- 速度對照雙卡片 -->
  <div class="speed-compare-grid">
    <div class="speed-card">
      <div class="speed-card-title">積分速度</div>
      <div class="speed-val-lg gmeter-color"><span id="speed-val">0.0</span><span class="unit">km/h</span></div>
    </div>
    <div class="speed-card">
      <div class="speed-card-title">GPS速度</div>
      <div class="speed-val-lg gps-color"><span id="gps-speed-val">0.0</span><span class="unit">km/h</span></div>
    </div>
  </div>

  <!-- 速度、位移與雙軸加速度顯示面板 -->
  <div class="result-box">
    <div class="distance-box">
      積分後累積位移：<span id="dist-val">0.0</span> <span id="dist-unit">m</span>
    </div>

    <div class="info">
      <span class="axis-title">X-axis (左右)：</span>
      <span id="accel-x-val" style="color: #2ecc71; font-weight: bold;">0.000</span> m/s² 
      (<span id="g-x-val">0.000</span> G)
    </div>
    
    <div class="info">
      <span class="axis-title">Y-axis (前後)：</span>
      <span id="accel-val" style="color: #ff9800; font-weight: bold;">0.000</span> m/s² 
      (<span id="g-val">0.000</span> G)
    </div>

    <div class="info" style="font-size: 0.72rem; color: #666; margin-top: 8px; border-top: 1px dashed #333; padding-top: 6px;">
      測量時長：<span id="timer-val">0.0</span> s 
      <div class="info" style="font-size: 0.72rem; color: #666; margin-top: 8px; border-top: 1px dashed #333; padding-top: 6px;">
        積分極速：<span id="max-speed-val">0.0</span> km/h | GPS 極速：<span id="gps-max-speed-val">0.0</span> km/h
      </div>
    </div>
  </div>


<!-- 核心控制按鈕列 (調整後的順序) -->
<div class="btn-row">
  <!-- 第一排 -->
  <button id="btn-zero" class="ctrl-btn btn-zero-style">矯正歸零</button>
  <button id="btn-reset" class="reset-btn">重置</button>
  
  <!-- 第二排 -->
  <button id="btn-toggle-accel" class="ctrl-btn btn-gmeter-idle">錄製積分</button>
  <button id="btn-toggle-gps" class="ctrl-btn btn-gps-idle">錄製 GPS</button>
</div>



  <!-- 參數與偏置設定面板 -->
  <div class="helper-box">
    <span class="helper-label">濾波器與雙軸偏置校準</span>
    
    <label for="lpf-slider" style="font-size: 0.78rem; color: #aaa;">低通濾波強度 (Smoothing Alpha: <span id="lpf-val">0.15</span>)</label>
    <div class="helper-inputs">
      <input type="range" id="lpf-slider" min="0.01" max="0.50" step="0.01" value="0.15">
    </div>

    <label style="font-size: 0.78rem; color: #aaa;">Y 軸縱向零點偏置 (Zero Offset):</label>
    <div class="helper-inputs">
      <input type="text" id="bias-display-y" value="0.0000 m/s²" readonly>
    </div>

    <label style="font-size: 0.78rem; color: #aaa;">X 軸橫向零點偏置 (Zero Offset):</label>
    <div class="helper-inputs">
      <input type="text" id="bias-display-x" value="0.0000 m/s²" readonly>
    </div>
  </div>

  <hr>

  <!-- 歷史觀測紀錄日誌 -->
  <div class="record-card">
    <div class="record-header">
      <h3 class="category-title" style="border: none; padding: 0;">觀測紀錄</h3>
      <button id="btn-clear-history" class="btn-clear-all">清空紀錄</button>
    </div>

    <div class="record-table-wrapper">
      <table class="record-table">
        <thead>
          <tr>
            <th>時間</th>
            <th>積分極速</th>
            <th>GPS極速</th>
            <th>位移</th>
            <th>時長</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="records-tbody">
          <tr>
            <td colspan="6" class="placeholder-text">尚無觀測紀錄，按下停止錄製即自動存檔</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分頁選單 -->
    <div class="pagination-container">
      <button id="btn-prev-page" class="btn-page" disabled>上一頁</button>
      <span id="page-info" class="page-info">第 1 / 1 頁</span>
      <button id="btn-next-page" class="btn-page" disabled>下一頁</button>
    </div>
  </div>
</div>

<script>
// --- 核心變數 ---
let isAccelRecording = false; 
let isGpsRecording = false;   
let isCalibrated = false;

let xOffset = 0.0;           
let yOffset = 0.0;           

let currentRawX = 0.0;
let currentRawY = 0.0;
let filteredX = 0.0;
let filteredY = 0.0;

let longTermBuffer = [];
const LONG_WINDOW_SIZE = 100;

let currentSpeed = 0.0;      
let maxSpeedKmh = 0.0;       
let totalDisplacement = 0.0; 
let stillFrameCount = 0;

let gpsWatchId = null;
let currentGpsSpeedKmh = 0.0;
let maxGpsSpeedKmh = 0.0;    

let lastAccelTimestamp = null;
let recordingStartTime = null;
let totalRecordedTime = 0.0;
let timerInterval = null; // 全局計時器

let lpfAlpha = 0.15;         

let records = [];
let currentPage = 1;
const rowsPerPage = 5;

// DOM 元素
const speedValEl = document.getElementById('speed-val');
const gpsSpeedValEl = document.getElementById('gps-speed-val');
const distValEl = document.getElementById('dist-val');
const distUnitEl = document.getElementById('dist-unit');
const accelValEl = document.getElementById('accel-val');
const gValEl = document.getElementById('g-val');
const accelXValEl = document.getElementById('accel-x-val');
const gXValEl = document.getElementById('g-x-val');
const timerValEl = document.getElementById('timer-val');
const maxSpeedValEl = document.getElementById('max-speed-val');
const gpsMaxSpeedValEl = document.getElementById('gps-max-speed-val');

const calibStatusEl = document.getElementById('calib-status');
const gpsStatusEl = document.getElementById('gps-status');
const biasDisplayYEl = document.getElementById('bias-display-y');
const biasDisplayXEl = document.getElementById('bias-display-x');

const btnZero = document.getElementById('btn-zero');
const btnToggleAccel = document.getElementById('btn-toggle-accel');
const btnToggleGps = document.getElementById('btn-toggle-gps');
const btnReset = document.getElementById('btn-reset');
const lpfSlider = document.getElementById('lpf-slider');
const lpfValEl = document.getElementById('lpf-val');

const recordsTbody = document.getElementById('records-tbody');
const btnClearHistory = document.getElementById('btn-clear-history');
const btnPrevPage = document.getElementById('btn-prev-page');
const btnNextPage = document.getElementById('btn-next-page');
const pageInfoEl = document.getElementById('page-info');

// 權限啟動
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
  document.getElementById('btn-request-permission').addEventListener('click', () => {
    DeviceMotionEvent.requestPermission()
      .then(response => {
        if (response === 'granted') {
          initSensorListener();
          document.getElementById('btn-request-permission').style.display = 'none';
        } else {
          alert('需要加速度計權限才能進行測速！');
        }
      })
      .catch(console.error);
  });
} else {
  document.getElementById('btn-request-permission').style.display = 'none';
  initSensorListener();
}

document.getElementById('btn-request-gps').addEventListener('click', () => {
  initGpsListener();
});

// 通用濾波器
function processAccelerationAdaptive(rawY, yOffset, speedMps) {
  let cleanAccel = rawY - yOffset;
  const speedKmh = speedMps * 3.6;

  if (speedKmh < 3.0) {
    return Math.abs(cleanAccel) < 0.015 ? 0 : cleanAccel;
  }

  longTermBuffer.push(cleanAccel);
  if (longTermBuffer.length > LONG_WINDOW_SIZE) {
    longTermBuffer.shift();
  }

  let sum = 0;
  for (let val of longTermBuffer) sum += val;
  let longTermAvg = sum / longTermBuffer.length;

  if (Math.abs(longTermAvg) < 0.35) {
    cleanAccel = cleanAccel - longTermAvg;
  }

  return cleanAccel;
}

// 2. 監聽感測器
function initSensorListener() {
  window.addEventListener('devicemotion', (event) => {
    if (!event.accelerationIncludingGravity) return;
    
    currentRawX = event.accelerationIncludingGravity.x || 0.0;
    currentRawY = event.accelerationIncludingGravity.y || 0.0;

    filteredX = filteredX + lpfAlpha * (currentRawX - filteredX);
    filteredY = filteredY + lpfAlpha * (currentRawY - filteredY);

    let cleanAccelX = filteredX - xOffset;
    let cleanAccelY = processAccelerationAdaptive(filteredY, yOffset, currentSpeed);

    accelValEl.textContent = cleanAccelY.toFixed(3);
    gValEl.textContent = (cleanAccelY / 9.80665).toFixed(3);

    accelXValEl.textContent = cleanAccelX.toFixed(3);
    gXValEl.textContent = (cleanAccelX / 9.80665).toFixed(3);

    const now = performance.now();

    if (isAccelRecording) {
      if (lastAccelTimestamp !== null) {
        let dt = (now - lastAccelTimestamp) / 1000.0; 
        if (dt > 0 && dt < 0.5) { 

          if (cleanAccelY === 0 && currentSpeed < (3.0 / 3.6)) {
            stillFrameCount++;
            if (stillFrameCount > 30) {
              currentSpeed = 0.0;
            }
          } else {
            stillFrameCount = 0;
          }

          currentSpeed += cleanAccelY * dt;
          if (currentSpeed < 0) currentSpeed = 0; 

          totalDisplacement += currentSpeed * dt;

          let speedKmh = currentSpeed * 3.6;
          speedValEl.textContent = speedKmh.toFixed(1);

          if (speedKmh > maxSpeedKmh) {
            maxSpeedKmh = speedKmh;
            maxSpeedValEl.textContent = maxSpeedKmh.toFixed(1);
          }

          if (totalDisplacement >= 1000) {
            distValEl.textContent = (totalDisplacement / 1000).toFixed(2);
            distUnitEl.textContent = "km";
          } else {
            distValEl.textContent = totalDisplacement.toFixed(1);
            distUnitEl.textContent = "m";
          }
        }
      }
      lastAccelTimestamp = now;
    }
  });
}

// 3. GPS 監聽
function initGpsListener() {
  if (!("geolocation" in navigator)) {
    alert("您的裝置或瀏覽器不支援 GPS 定位！");
    return;
  }

  gpsStatusEl.className = "status-tag status-gps";
  gpsStatusEl.textContent = "GPS 定位：正在搜尋衛星...";

  gpsWatchId = navigator.geolocation.watchPosition(
    (position) => {
      const speedMps = position.coords.speed;
      const accuracy = position.coords.accuracy;

      if (speedMps !== null && speedMps >= 0) {
        currentGpsSpeedKmh = speedMps * 3.6;
        gpsSpeedValEl.textContent = currentGpsSpeedKmh.toFixed(1);

        if (isGpsRecording && currentGpsSpeedKmh > maxGpsSpeedKmh) {
          maxGpsSpeedKmh = currentGpsSpeedKmh;
          gpsMaxSpeedValEl.textContent = maxGpsSpeedKmh.toFixed(1);
        }
      } else {
        gpsSpeedValEl.textContent = "0.0";
      }

      gpsStatusEl.className = "status-tag status-gps";
      gpsStatusEl.textContent = `GPS 定位：訊號良好 (精度 ±${Math.round(accuracy)}m)`;
    },
    (error) => {
      gpsSpeedValEl.textContent = "0.0";
      gpsStatusEl.className = "status-tag status-inactive";
      if (error.code === error.POSITION_UNAVAILABLE) {
        gpsStatusEl.textContent = "GPS 定位：地下段 (無 GPS 訊號)";
      } else if (error.code === error.PERMISSION_DENIED) {
        gpsStatusEl.textContent = "GPS 定位：使用者拒絕授權";
      } else {
        gpsStatusEl.textContent = "GPS 定位：訊號微弱";
      }
    },
    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 5000
    }
  );
}

// 獨立全局秒數計時器
function updateGlobalTimer() {
  if (isAccelRecording || isGpsRecording) {
    if (recordingStartTime !== null) {
      totalRecordedTime = (performance.now() - recordingStartTime) / 1000.0;
      timerValEl.textContent = totalRecordedTime.toFixed(1);
    }
  }
}

function startRecordingTimer() {
  if (timerInterval === null) {
    recordingStartTime = performance.now();
    timerInterval = setInterval(updateGlobalTimer, 100);
  }
}

function stopRecordingTimerIfIdle() {
  if (!isAccelRecording && !isGpsRecording) {
    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }
}

// 4. 按鈕觸發機制

btnZero.addEventListener('click', () => {
  xOffset = filteredX;
  yOffset = filteredY;
  isCalibrated = true;

  currentSpeed = 0.0;
  totalDisplacement = 0.0;
  stillFrameCount = 0;
  longTermBuffer = [];
  
  speedValEl.textContent = "0.0";
  distValEl.textContent = "0.0";
  distUnitEl.textContent = "m";

  biasDisplayXEl.value = xOffset.toFixed(4) + " m/s²";
  biasDisplayYEl.value = yOffset.toFixed(4) + " m/s²";

  calibStatusEl.className = "status-tag status-active";
  calibStatusEl.textContent = "積分校準：雙軸已完成矯正歸零";
});

// 開啟/停止 積分錄製
btnToggleAccel.addEventListener('click', () => {
  if (!isCalibrated && !isAccelRecording) {
    if (!confirm("⚠️ 尚未執行矯正歸零，建議在靜止時按「矯正歸零」以避免重力漂移！確定要直接開始嗎？")) {
      return;
    }
  }

  isAccelRecording = !isAccelRecording;

  if (isAccelRecording) {
    btnToggleAccel.textContent = "停止積分";
    btnToggleAccel.className = "ctrl-btn btn-gmeter-recording";
    lastAccelTimestamp = performance.now();
    startRecordingTimer();
  } else {
    btnToggleAccel.textContent = "錄製積分";
    btnToggleAccel.className = "ctrl-btn btn-gmeter-idle";
    
    // 立即將當前錄製寫入歷史日誌
    saveCurrentRecord(true, false);
    stopRecordingTimerIfIdle();
  }
});

// 開啟/停止 GPS 錄製
btnToggleGps.addEventListener('click', () => {
  if (gpsWatchId === null && !isGpsRecording) {
    initGpsListener();
  }

  isGpsRecording = !isGpsRecording;

  if (isGpsRecording) {
    btnToggleGps.textContent = "停止 GPS";
    btnToggleGps.className = "ctrl-btn btn-gps-recording";
    startRecordingTimer();
  } else {
    btnToggleGps.textContent = "錄製 GPS";
    btnToggleGps.className = "ctrl-btn btn-gps-idle";

    // 立即將當前錄製寫入歷史日誌
    saveCurrentRecord(false, true);
    stopRecordingTimerIfIdle();
  }
});

// 寫入紀錄核心邏輯
function saveCurrentRecord(hasAccel, hasGps) {
  if (totalRecordedTime > 0.2) {
    addRecord(
      maxSpeedKmh, 
      maxGpsSpeedKmh, 
      totalDisplacement, 
      totalRecordedTime, 
      hasAccel || maxSpeedKmh > 0, 
      hasGps || maxGpsSpeedKmh > 0
    );
  }
}

// RESET 重置
btnReset.addEventListener('click', () => {
  if (isAccelRecording || isGpsRecording) {
    saveCurrentRecord(isAccelRecording, isGpsRecording);
  }

  isAccelRecording = false;
  isGpsRecording = false;
  btnToggleAccel.textContent = "錄製積分";
  btnToggleAccel.className = "ctrl-btn btn-gmeter-idle";
  btnToggleGps.textContent = "錄製 GPS";
  btnToggleGps.className = "ctrl-btn btn-gps-idle";
  
  stopRecordingTimerIfIdle();

  currentSpeed = 0.0;
  maxSpeedKmh = 0.0;
  maxGpsSpeedKmh = 0.0;
  totalDisplacement = 0.0;
  totalRecordedTime = 0.0;
  stillFrameCount = 0;
  lastAccelTimestamp = null;
  recordingStartTime = null;
  longTermBuffer = [];

  speedValEl.textContent = "0.0";
  gpsSpeedValEl.textContent = "0.0";
  maxSpeedValEl.textContent = "0.0";
  gpsMaxSpeedValEl.textContent = "0.0";
  distValEl.textContent = "0.0";
  distUnitEl.textContent = "m";
  timerValEl.textContent = "0.0";
});

lpfSlider.addEventListener('input', (e) => {
  lpfAlpha = parseFloat(e.target.value);
  lpfValEl.textContent = lpfAlpha.toFixed(2);
});

// 5. 日誌渲染與分頁
function addRecord(maxSpeed, maxGpsSpeed, displacement, duration, hasAccelData, hasGpsData) {
  const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  
  let dispStr = hasAccelData 
    ? (displacement >= 1000 ? (displacement / 1000).toFixed(2) + " km" : displacement.toFixed(1) + " m")
    : "---";

  records.unshift({
    id: Date.now(),
    time: timeStr,
    maxSpeed: hasAccelData ? maxSpeed.toFixed(1) + " km/h" : "N/A",
    maxGpsSpeed: hasGpsData ? maxGpsSpeed.toFixed(1) + " km/h" : "N/A",
    disp: dispStr,
    duration: duration.toFixed(1) + " s"
  });
  
  renderRecords();
}

function renderRecords() {
  if (records.length === 0) {
    recordsTbody.innerHTML = `<tr><td colspan="6" class="placeholder-text">尚無觀測紀錄，按下停止錄製即自動存檔</td></tr>`;
    btnPrevPage.disabled = true;
    btnNextPage.disabled = true;
    pageInfoEl.textContent = `第 1 / 1 頁`;
    return;
  }

  const totalPages = Math.ceil(records.length / rowsPerPage);
  if (currentPage > totalPages) currentPage = totalPages;

  const startIndex = (currentPage - 1) * rowsPerPage;
  const pageRecords = records.slice(startIndex, startIndex + rowsPerPage);

  recordsTbody.innerHTML = pageRecords.map(r => `
    <tr>
      <td>${r.time}</td>
      <td class="record-data-cell"><span class="record-badge ${r.maxSpeed !== 'N/A' ? 'badge-gmeter' : 'badge-none'}">${r.maxSpeed}</span></td>
      <td class="record-data-cell"><span class="record-badge ${r.maxGpsSpeed !== 'N/A' ? 'badge-gps' : 'badge-none'}">${r.maxGpsSpeed}</span></td>
      <td style="color: ${r.disp !== '---' ? '#3498db' : '#666'}; font-weight: 600;">${r.disp}</td>
      <td>${r.duration}</td>
      <td><button class="btn-delete" onclick="deleteRecord(${r.id})">刪除</button></td>
    </tr>
  `).join('');

  pageInfoEl.textContent = `第 ${currentPage} / ${totalPages} 頁`;
  btnPrevPage.disabled = (currentPage === 1);
  btnNextPage.disabled = (currentPage === totalPages);
}

window.deleteRecord = function(id) {
  records = records.filter(r => r.id !== id);
  renderRecords();
};

btnClearHistory.addEventListener('click', () => {
  if (records.length === 0) return;
  if (confirm("確定要清空所有歷史觀測紀錄嗎？")) {
    records = [];
    currentPage = 1;
    renderRecords();
  }
});

btnPrevPage.addEventListener('click', () => {
  if (currentPage > 1) {
    currentPage--;
    renderRecords();
  }
});

btnNextPage.addEventListener('click', () => {
  const totalPages = Math.ceil(records.length / rowsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderRecords();
  }
});
</script>
