  <!DOCTYPE html>
<body>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加速度積分 與 GPS測速器</title>
  <style>
  /* --- 基礎設定 --- */
  * { box-sizing: border-box; }

  body { 
    margin: 0; 
    background: #121212; 
    color: #e0e0e0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex; 
    justify-content: center; 
    padding: 12px; 
    width: 100%;   
  }

  /* 主容器 */
  .calculator { 
    background: #1e1e1e; 
    padding: 20px; 
    border-radius: 16px; 
    width: 100%;       
    max-width: 440px; 
    border: 1px solid #333;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45); 
    overflow: hidden;  
  }

  h1 { font-size: 1.2rem; color: #ff9800; text-align: center; margin: 0 0 15px; }

  /* 萬用按鈕點擊特效 */
  .calculator button:active,
  .record-card button:active { 
    filter: brightness(0.75) !important; 
    transform: scale(0.95) !important; 
    transition: filter 0.05s, transform 0.05s !important;
  }

  /* 輸入框控制 */
  input { 
    width: 100%; 
    padding: 10px; 
    background: #252525; 
    border: 1px solid #444; 
    border-radius: 8px; 
    color: #fff; 
    outline: none; 
    font-size: 0.85rem;
  }

  input:focus { border-color: #ff9800; }

  /* 核心錄製按鈕 (寬度比重設為 1.3，防止文字換行) */
  .calc-btn { 
    flex: 1.3; 
    background: #ff9800; 
    color: #121212; 
    border: none; 
    padding: 12px 6px; 
    border-radius: 8px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 0.88rem;
    white-space: nowrap;
  }

  .calc-btn:hover { background: #e68a00; }

  /* 矯正歸零按鈕專用樣式 */
  .btn-zero-style {
    flex: 1;
    background: #e65c00;
    color: #ffffff;
    border: none;
    padding: 12px 6px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.88rem;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  .btn-zero-style:hover { background: #cf5300; }

  /* 速度對照卡片雙欄佈局 */
  .speed-compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .speed-card {
    background: #181818;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 10px 5px;
    text-align: center;
  }

  .speed-card-title {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .speed-val-lg {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.1;
  }

  .gmeter-color { color: #ff9800; }
  .gps-color { color: #00bcd4; }

  .unit { font-size: 0.75rem; color: #666; margin-left: 2px; }

  /* 結果區域 */
  .result-box { 
    background: #121212; 
    padding: 14px; 
    border-radius: 12px; 
    text-align: center; 
    margin: 12px 0; 
    border: 1px solid #222; 
  }
  
  .distance-box {
    font-size: 0.95rem;
    color: #3498db;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .info { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
  .axis-title { color: #888; font-weight: 600; }

  hr { 
    border: 0; 
    border-top: 1px solid #333; 
    margin: 18px 0; 
  }

  .btn-row { 
    display: flex; 
    gap: 8px; 
    margin: 10px 0; 
  }

  .reset-btn { 
    flex: 0 0 70px; 
    background: #333; 
    color: #999; 
    border: 1px solid #444; 
    border-radius: 8px; 
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
  }

  /* 參數設定外框 */
  .helper-box {
    background: #2a2a2a;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px dashed #555;
  }

  .helper-label {
    color: #ff9800;
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }

  .helper-inputs {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 8px;
  }

  .btn-fill {
    flex: 1;
    padding: 10px;
    background: transparent;
    color: #ff9800;
    border: 1.5px solid #ff9800;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .category-title {
  color: #fff !important;      
  font-size: 0.95rem;          
  font-weight: 800;            
  /* 刪除：width: 100%;  <-- 這行是導致按鈕被擠下去的主因 */
  width: auto;                  /* 改為 auto 或直接刪除該行 */
  padding-top: 0 !important;   /* 避免上方留白過大 */
  padding-bottom: 5px !important;
  border-bottom: 2px solid #ff9800;
}


  /* 歷史觀測紀錄日誌樣式 */
  .record-card { margin-top: 15px; }

  .record-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid #333;
    padding-bottom: 8px;
  }

.btn-clear-all {
  background-color: #e74c3c !important;
  color: white !important;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap; /* <-- 新增這行，防止文字分成兩行 */
}


  .record-table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 6px;
  }

  .record-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 12px;
    white-space: nowrap; 
  }

  .record-table th {
    padding: 8px 6px;
    border-bottom: 2px solid #333;
    color: #888;
    font-weight: 500;
  }

  .record-table td {
    padding: 8px 6px;
    vertical-align: middle;
  }

  .record-data-cell {
    font-family: 'Noto Sans Mono', ui-monospace, Consolas, monospace !important;
    font-weight: 700;
  }

  .record-badge {
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
  }

  .badge-gmeter { background-color: rgba(255, 152, 0, 0.15); color: #ff9800; }
  .badge-gps { background-color: rgba(0, 188, 212, 0.15); color: #00bcd4; }

  .btn-delete {
    background: #442222;
    color: #ff6666;
    border: 1px solid #663333;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }

  .pagination-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .btn-page {
    background: #2a2a2a;
    color: #ff9800;
    border: 1px solid #ff9800;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.8rem;
  }

  .btn-page:disabled { border-color: #444; color: #555; cursor: not-allowed; }
  .page-info { font-size: 0.8rem; color: #aaa; }

  /* 自訂狀態警示標籤 */
  .status-tag {
    font-size: 0.72rem;
    padding: 3px 6px;
    border-radius: 4px;
    display: inline-block;
  }
  .status-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
  .status-inactive { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
  .status-gps { background: rgba(0, 188, 212, 0.2); color: #00bcd4; border: 1px solid #00bcd4; }
  .placeholder-text { color: #555; text-align: center; font-size: 0.8rem; padding: 15px 0; }
  </style>
</head>
<body>

<div class="calculator">
  <h1>加速度積分 與 GPS測速器</h1>

  <!-- 權限要求按鈕列 -->
  <div id="permission-btn-container" style="margin-bottom: 12px; display: flex; gap: 8px;">
    <button id="btn-request-permission" class="btn-fill">啟動動態感測器</button>
    <button id="btn-request-gps" class="btn-fill" style="color: #00bcd4; border-color: #00bcd4;">開啟 GPS 定位</button>
  </div>

  <!-- 狀態提示區域 -->
  <div style="text-align: center; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; align-items: center;">
    <span id="calib-status" class="status-tag status-inactive">未校準 (請靜止時按矯正歸零)</span>
    <span id="gps-status" class="status-tag status-inactive">GPS 定位：未啟動</span>
  </div>

  <!-- 速度對照雙卡片 -->
  <div class="speed-compare-grid">
    <div class="speed-card">
      <div class="speed-card-title">積分速度</div>
      <div class="speed-val-lg gmeter-color"><span id="speed-val">0.0</span><span class="unit">km/h</span></div>
    </div>
    <div class="speed-card">
      <div class="speed-card-title">GPS速度</div>
      <div class="speed-val-lg gps-color"><span id="gps-speed-val">0.0</span><span class="unit">km/h</span></div>
    </div>
  </div>

  <!-- 速度、位移與雙軸加速度顯示面板 -->
  <div class="result-box">
    <!-- 總位移顯示區 -->
    <div class="distance-box">
      積分後累積位移：<span id="dist-val">0.0</span> <span id="dist-unit">m</span>
    </div>

    <!-- X 軸 橫向向心加速度 -->
    <div class="info">
      <span class="axis-title">X-axis (左右)：</span>
      <span id="accel-x-val" style="color: #2ecc71; font-weight: bold;">0.000</span> m/s² 
      (<span id="g-x-val">0.000</span> G)
    </div>
    
    <!-- Y 軸 縱向加速/減速 -->
    <div class="info">
      <span class="axis-title">Y-axis (前後)：</span>
      <span id="accel-val" style="color: #ff9800; font-weight: bold;">0.000</span> m/s² 
      (<span id="g-val">0.000</span> G)
    </div>

    <div class="info" style="font-size: 0.72rem; color: #666; margin-top: 8px; border-top: 1px dashed #333; padding-top: 6px;">
      測量時長：<span id="timer-val">0.0</span> s 
      <div class="info" style="font-size: 0.72rem; color: #666; margin-top: 8px; border-top: 1px dashed #333; padding-top: 6px;">
      積分極速：<span id="max-speed-val">0.0</span> km/h | GPS 極速：<span id="gps-max-speed-val">0.0</span> km/h
    </div>
  </div>

  <!-- 核心控制按鈕列 -->
  <div class="btn-row">
    <button id="btn-zero" class="btn-zero-style">矯正歸零</button>
    <button id="btn-toggle" class="calc-btn">開始錄製</button>
    <button id="btn-reset" class="reset-btn">重置</button>
  </div>

  <!-- 參數與偏置設定面板 -->
  <div class="helper-box">
    <span class="helper-label">濾波器與雙軸偏置校準</span>
    
    <label for="lpf-slider" style="font-size: 0.78rem; color: #aaa;">低通濾波強度 (Smoothing Alpha: <span id="lpf-val">0.15</span>)</label>
    <div class="helper-inputs">
      <input type="range" id="lpf-slider" min="0.01" max="0.50" step="0.01" value="0.15">
    </div>

    <label style="font-size: 0.78rem; color: #aaa;">Y 軸縱向零點偏置 (Zero Offset):</label>
    <div class="helper-inputs">
      <input type="text" id="bias-display-y" value="0.0000 m/s²" readonly>
    </div>

    <label style="font-size: 0.78rem; color: #aaa;">X 軸橫向零點偏置 (Zero Offset):</label>
    <div class="helper-inputs">
      <input type="text" id="bias-display-x" value="0.0000 m/s²" readonly>
    </div>
  </div>

  <hr>

  <!-- 歷史觀測紀錄日誌 -->
  <div class="record-card">
    <div class="record-header">
      <h3 class="category-title" style="border: none; padding: 0;">觀測紀錄</h3>
      <button id="btn-clear-history" class="btn-clear-all">清空紀錄</button>
    </div>

    <div class="record-table-wrapper">
      <table class="record-table">
        <thead>
          <tr>
            <th>時間</th>
            <th>積分極速</th>
            <th>GPS極速</th>
            <th>位移</th>
            <th>時長</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="records-tbody">
          <tr>
            <td colspan="6" class="placeholder-text">尚無觀測紀錄，按下停止錄製即自動存檔</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分頁選單 -->
    <div class="pagination-container">
      <button id="btn-prev-page" class="btn-page" disabled>上一頁</button>
      <span id="page-info" class="page-info">第 1 / 1 頁</span>
      <button id="btn-next-page" class="btn-page" disabled>下一頁</button>
    </div>
  </div>
</div>

<script>
// --- 核心演算法與全局變數 ---
let isRecording = false;
let isCalibrated = false;

// 偏置量 (Zero Offset)
let xOffset = 0.0;           
let yOffset = 0.0;           

// 雙軸 Raw & Filtered 數據
let currentRawX = 0.0;
let currentRawY = 0.0;
let filteredX = 0.0;
let filteredY = 0.0;

// 運動學數據
let currentSpeed = 0.0;      // 積分當前速度 (m/s)
let maxSpeedKmh = 0.0;       // 積分最高速 (km/h)
let totalDisplacement = 0.0; // 總位移 (m)

// GPS 數據
let gpsWatchId = null;
let currentGpsSpeedKmh = 0.0;// 當前 GPS 速度 (km/h)
let maxGpsSpeedKmh = 0.0;    // GPS 最高速 (km/h)

let lastTimestamp = null;
let recordingStartTime = null;
let totalRecordedTime = 0.0;

let lpfAlpha = 0.15;         // 低通濾波 Alpha 值

// 分頁紀錄相關變數
let records = [];
let currentPage = 1;
const rowsPerPage = 5;

// DOM 元件引用
const speedValEl = document.getElementById('speed-val');
const gpsSpeedValEl = document.getElementById('gps-speed-val');
const distValEl = document.getElementById('dist-val');
const distUnitEl = document.getElementById('dist-unit');
const accelValEl = document.getElementById('accel-val');
const gValEl = document.getElementById('g-val');
const accelXValEl = document.getElementById('accel-x-val');
const gXValEl = document.getElementById('g-x-val');
const timerValEl = document.getElementById('timer-val');
const maxSpeedValEl = document.getElementById('max-speed-val');
const gpsMaxSpeedValEl = document.getElementById('gps-max-speed-val');

const calibStatusEl = document.getElementById('calib-status');
const gpsStatusEl = document.getElementById('gps-status');
const biasDisplayYEl = document.getElementById('bias-display-y');
const biasDisplayXEl = document.getElementById('bias-display-x');

const btnZero = document.getElementById('btn-zero');
const btnToggle = document.getElementById('btn-toggle');
const btnReset = document.getElementById('btn-reset');
const lpfSlider = document.getElementById('lpf-slider');
const lpfValEl = document.getElementById('lpf-val');

const recordsTbody = document.getElementById('records-tbody');
const btnClearHistory = document.getElementById('btn-clear-history');
const btnPrevPage = document.getElementById('btn-prev-page');
const btnNextPage = document.getElementById('btn-next-page');
const pageInfoEl = document.getElementById('page-info');

// --- 1. iOS / Android 權限與感測器初始化 ---
const permBtnContainer = document.getElementById('permission-btn-container');

if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
  document.getElementById('btn-request-permission').addEventListener('click', () => {
    DeviceMotionEvent.requestPermission()
      .then(response => {
        if (response === 'granted') {
          initSensorListener();
          document.getElementById('btn-request-permission').style.display = 'none';
        } else {
          alert('需要加速度計權限才能進行測速！');
        }
      })
      .catch(console.error);
  });
} else {
  document.getElementById('btn-request-permission').style.display = 'none';
  initSensorListener();
}

// GPS 定位授權與監聽
document.getElementById('btn-request-gps').addEventListener('click', () => {
  initGpsListener();
});

// --- 2. 監聽手機雙軸加速度計事件 ---
function initSensorListener() {
  window.addEventListener('devicemotion', (event) => {
    if (!event.accelerationIncludingGravity) return;
    
    currentRawX = event.accelerationIncludingGravity.x || 0.0;
    currentRawY = event.accelerationIncludingGravity.y || 0.0;

    filteredX = filteredX + lpfAlpha * (currentRawX - filteredX);
    filteredY = filteredY + lpfAlpha * (currentRawY - filteredY);

    let cleanAccelX = filteredX - xOffset;
    let cleanAccelY = filteredY - yOffset;

    accelValEl.textContent = cleanAccelY.toFixed(3);
    gValEl.textContent = (cleanAccelY / 9.80665).toFixed(3);

    accelXValEl.textContent = cleanAccelX.toFixed(3);
    gXValEl.textContent = (cleanAccelX / 9.80665).toFixed(3);

    const now = performance.now();
    if (isRecording) {
      if (lastTimestamp !== null) {
        let dt = (now - lastTimestamp) / 1000.0; 
        if (dt > 0 && dt < 0.5) { 

          // 1. 一次積分：計算車速
          currentSpeed += cleanAccelY * dt;
          if (currentSpeed < 0) currentSpeed = 0; 

          // 2. 二次積分：計算總位移
          totalDisplacement += currentSpeed * dt;

          let speedKmh = currentSpeed * 3.6;
          speedValEl.textContent = speedKmh.toFixed(1);

          if (speedKmh > maxSpeedKmh) {
            maxSpeedKmh = speedKmh;
            maxSpeedValEl.textContent = maxSpeedKmh.toFixed(1);
          }

          if (totalDisplacement >= 1000) {
            distValEl.textContent = (totalDisplacement / 1000).toFixed(2);
            distUnitEl.textContent = "km";
          } else {
            distValEl.textContent = totalDisplacement.toFixed(1);
            distUnitEl.textContent = "m";
          }

          totalRecordedTime = (now - recordingStartTime) / 1000.0;
          timerValEl.textContent = totalRecordedTime.toFixed(1);
        }
      }
      lastTimestamp = now;
    }
  });
}

// --- 3. GPS 衛星測速監聽器 ---
function initGpsListener() {
  if (!("geolocation" in navigator)) {
    alert("您的裝置或瀏覽器不支援 GPS 定位！");
    return;
  }

  gpsStatusEl.className = "status-tag status-gps";
  gpsStatusEl.textContent = "GPS 定位：正在搜尋衛星...";

  gpsWatchId = navigator.geolocation.watchPosition(
    (position) => {
      const speedMps = position.coords.speed; // 單位 m/s
      const accuracy = position.coords.accuracy; // 精度 (m)

      if (speedMps !== null && speedMps >= 0) {
        currentGpsSpeedKmh = speedMps * 3.6;
        gpsSpeedValEl.textContent = currentGpsSpeedKmh.toFixed(1);

        if (isRecording && currentGpsSpeedKmh > maxGpsSpeedKmh) {
          maxGpsSpeedKmh = currentGpsSpeedKmh;
          gpsMaxSpeedValEl.textContent = maxGpsSpeedKmh.toFixed(1);
        }
      } else {
        gpsSpeedValEl.textContent = "0.0";
      }

      gpsStatusEl.className = "status-tag status-gps";
      gpsStatusEl.textContent = `GPS 定位：訊號良好 (精度 ±${Math.round(accuracy)}m)`;
    },
    (error) => {
      gpsSpeedValEl.textContent = "0.0";
      gpsStatusEl.className = "status-tag status-inactive";
      if (error.code === error.POSITION_UNAVAILABLE) {
        gpsStatusEl.textContent = "GPS 定位：地下段 (無 GPS 訊號)";
      } else if (error.code === error.PERMISSION_DENIED) {
        gpsStatusEl.textContent = "GPS 定位：使用者拒絕授權";
      } else {
        gpsStatusEl.textContent = "GPS 定位：訊號微弱";
      }
    },
    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 5000
    }
  );
}

// --- 4. 按鈕事件綁定 ---

// 【矯正歸零按鈕】
btnZero.addEventListener('click', () => {
  xOffset = filteredX;
  yOffset = filteredY;
  isCalibrated = true;

  currentSpeed = 0.0;
  totalDisplacement = 0.0;
  
  speedValEl.textContent = "0.0";
  distValEl.textContent = "0.0";
  distUnitEl.textContent = "m";

  biasDisplayXEl.value = xOffset.toFixed(4) + " m/s²";
  biasDisplayYEl.value = yOffset.toFixed(4) + " m/s²";

  calibStatusEl.className = "status-tag status-active";
  calibStatusEl.textContent = "積分校準：雙軸已完成矯正歸零";
});

// 【START / STOP 開始與停止按鈕】
btnToggle.addEventListener('click', () => {
  if (!isCalibrated) {
    if (!confirm("⚠️ 尚未執行矯正歸零，建議在列車靜止時點擊「矯正歸零」以避免重力漂移！確定要直接開始嗎？")) {
      return;
    }
  }

  isRecording = !isRecording;

  if (isRecording) {
    btnToggle.textContent = "停止錄製";
    btnToggle.style.background = "#e74c3c";
    btnToggle.style.color = "#fff";
    
    lastTimestamp = performance.now();
    recordingStartTime = lastTimestamp;
  } else {
    btnToggle.textContent = "開始錄製";
    btnToggle.style.background = "#ff9800";
    btnToggle.style.color = "#121212";

    if (totalRecordedTime > 1.0) {
      addRecord(maxSpeedKmh, maxGpsSpeedKmh, totalDisplacement, totalRecordedTime);
    }
  }
});

// 【RESET 重置按鈕】
btnReset.addEventListener('click', () => {
  isRecording = false;
  btnToggle.textContent = "開始錄製";
  btnToggle.style.background = "#ff9800";
  btnToggle.style.color = "#121212";

  currentSpeed = 0.0;
  maxSpeedKmh = 0.0;
  maxGpsSpeedKmh = 0.0;
  totalDisplacement = 0.0;
  totalRecordedTime = 0.0;
  lastTimestamp = null;

  speedValEl.textContent = "0.0";
  gpsSpeedValEl.textContent = "0.0";
  maxSpeedValEl.textContent = "0.0";
  gpsMaxSpeedValEl.textContent = "0.0";
  distValEl.textContent = "0.0";
  distUnitEl.textContent = "m";
  timerValEl.textContent = "0.0";
});

// 【濾波器滑桿調整】
lpfSlider.addEventListener('input', (e) => {
  lpfAlpha = parseFloat(e.target.value);
  lpfValEl.textContent = lpfAlpha.toFixed(2);
});

// --- 5. 歷史紀錄日誌與分頁系統 ---
function addRecord(maxSpeed, maxGpsSpeed, displacement, duration) {
  const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  
  let dispStr = displacement >= 1000 
    ? (displacement / 1000).toFixed(2) + " km" 
    : displacement.toFixed(1) + " m";

  records.unshift({
    id: Date.now(),
    time: timeStr,
    maxSpeed: maxSpeed.toFixed(1) + " km/h",
    maxGpsSpeed: maxGpsSpeed > 0 ? maxGpsSpeed.toFixed(1) + " km/h" : "N/A",
    disp: dispStr,
    duration: duration.toFixed(1) + " s"
  });
  renderRecords();
}

function renderRecords() {
  if (records.length === 0) {
    recordsTbody.innerHTML = `<tr><td colspan="6" class="placeholder-text">尚無觀測紀錄，按下 STOP 即自動存檔</td></tr>`;
    btnPrevPage.disabled = true;
    btnNextPage.disabled = true;
    pageInfoEl.textContent = `第 1 / 1 頁`;
    return;
  }

  const totalPages = Math.ceil(records.length / rowsPerPage);
  if (currentPage > totalPages) currentPage = totalPages;

  const startIndex = (currentPage - 1) * rowsPerPage;
  const pageRecords = records.slice(startIndex, startIndex + rowsPerPage);

  recordsTbody.innerHTML = pageRecords.map(r => `
    <tr>
      <td>${r.time}</td>
      <td class="record-data-cell"><span class="record-badge badge-gmeter">${r.maxSpeed}</span></td>
      <td class="record-data-cell"><span class="record-badge badge-gps">${r.maxGpsSpeed}</span></td>
      <td style="color: #3498db; font-weight: 600;">${r.disp}</td>
      <td>${r.duration}</td>
      <td><button class="btn-delete" onclick="deleteRecord(${r.id})">刪除</button></td>
    </tr>
  `).join('');

  pageInfoEl.textContent = `第 ${currentPage} / ${totalPages} 頁`;
  btnPrevPage.disabled = (currentPage === 1);
  btnNextPage.disabled = (currentPage === totalPages);
}

window.deleteRecord = function(id) {
  records = records.filter(r => r.id !== id);
  renderRecords();
};

btnClearHistory.addEventListener('click', () => {
  if (records.length === 0) return;
  if (confirm("確定要清空所有歷史觀測紀錄嗎？")) {
    records = [];
    currentPage = 1;
    renderRecords();
  }
});

btnPrevPage.addEventListener('click', () => {
  if (currentPage > 1) {
    currentPage--;
    renderRecords();
  }
});

btnNextPage.addEventListener('click', () => {
  const totalPages = Math.ceil(records.length / rowsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderRecords();
  }
});
</script>
